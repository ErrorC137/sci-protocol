# Daily grant ingestion into Supabase (alternative to the Render cron in render.yaml).
name: ingest
on:
  schedule: [{ cron: "15 3 * * *" }]
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m app.ingest.run curated grants_gov eu_sedia
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", VOYAGE_API_KEY: "${{ secrets.VOYAGE_API_KEY }}" }
