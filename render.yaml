# Render Blueprint for the UPLO hackathon deployment.
# Free plan: no card needed, but the service sleeps after ~15 min idle and the first request then takes
# ~50s. Open the site a couple of minutes before a pitch (the web app pings /health every 30s while open).
# Free has no persistent disk, so nothing is kept on disk: with DATABASE_URL set, local-IPFS objects and
# uploaded forms live in Postgres (supabase/migrations/0002_blobs.sql). On a paid plan, "starter" removes
# the cold start. Free also has no cron jobs: the curated corpus loads on first boot, and the daily
# live-source ingest runs from .github/workflows/ingest.yml instead.
services:
  - type: web
    name: uplo-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore              # same region as the Supabase project
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # Supabase connection string (session pooler, port 5432)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY        # optional - local hashing embedder otherwise
        sync: false
      - key: PINATA_JWT            # optional - otherwise IPFS objects are kept in Postgres and served by the API
        sync: false
      - key: CHAIN_ID
        value: "43113"            # Avalanche Fuji; 43114 = C-Chain mainnet
      - key: RPC_URL               # Avalanche Fuji RPC (public: https://api.avax-test.network/ext/bc/C/rpc)
        sync: false
      - key: INDEXER_ENABLED
        value: "true"
      - key: CORS_ORIGINS          # your Vercel URL
        sync: false
      - key: STARTUP_CONNECTORS
        value: ""
