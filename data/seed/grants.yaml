grants:
  # ============================================================================
  # THAILAND
  # ============================================================================
  - ref: nia-open-innovation
    funder: nia
    title: "NIA Open Innovation Grant"
    summary: "Non-repayable co-funding for Thai companies taking an innovative product, process or service from prototype toward commercial launch. Typically covers part of project cost with the company contributing the rest."
    fields: []
    subdomains: ["Scale-up & pilot production"]
    trl: [5, 8]
    countries: [TH]
    applicant_types: [startup, sme]
    requires_incorporation: true
    ip_assignment_required: false
    amount: {min: 0, max: 1500000, currency: THB}
    equity_taken: false
    cycle: "Rounds announced through the year via the NIA portal"
    application_mode: portal
    confidence: medium
    verified: false
    notes: "Generally requires a Thai-registered juristic person with majority Thai shareholding and co-funding of the project cost; check current cap and co-funding ratio."

  - ref: nia-thematic-innovation
    funder: nia
    title: "NIA Thematic Innovation Program"
    summary: "Grant support for innovation projects in national priority themes (e.g. bio-circular-green economy, food, health, smart agriculture) with clear commercial or social impact."
    fields: [agritech, food_science, health, environmental, energy, materials]
    subdomains: ["Biomass valorization", "Agri-waste utilization", "Functional foods", "Waste management"]
    trl: [5, 8]
    countries: [TH]
