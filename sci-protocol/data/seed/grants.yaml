# SCI Protocol - hand-curated funding corpus
#
# READ BEFORE THE DEMO: every entry below was drafted from general knowledge (not from a live check of
# the funder's site) and is marked `verified: false`. Amounts, TRL bands, eligibility and cycles are
# indicative. Before demo day:
#   1. open each `url`, confirm or correct the fields, set `verified: true` and `last_reviewed: YYYY-MM-DD`
#   2. add real `deadline:` dates where a call is open (left blank on purpose - never guessed)
#   3. replace `local:` demo forms with the funder's official form URL where one is public
#
# Field reference
#   fields:           taxonomy ids (materials, agritech, biotech, energy, environmental, food_science,
#                     health, digital, manufacturing); [] = open to any field
#   subdomains:       controlled sub-domains from apps/api/app/models/taxonomy.py
#   trl:              [min, max]; omit if not stated
#   countries:        ISO2 codes or regions (ASEAN, EU27, HE_ELIGIBLE, GLOBAL); eligible applicant location
#   applicant_types:  individual | university | startup | sme | consortium
#   amount:           {min, max, currency} in the funder's currency; converted to USD at ingest
#   confidence:       how sure the curator is of the details (high | medium | low)

