<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research crowdfunding - project application (demo form)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px; color: #1f2937; background: #fff; }
  .demo { background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  label { display: block; font-weight: 600; margin-top: 16px; }
  input[type=text], input[type=email], input[type=number], select, textarea { width: 100%; padding: 8px; border: 1px solid #9ca3af; border-radius: 6px; font: inherit; box-sizing: border-box; }
  fieldset { border: 1px solid #d1d5db; border-radius: 6px; margin-top: 16px; }
  fieldset label { display: inline; font-weight: 400; margin-right: 12px; }
</style>
</head>
<body>
<p class="demo">DEMO FORM - a generic research-crowdfunding project form generated by SCI Protocol to demonstrate the HTML pre-fill path. Not any platform's real form.</p>
<h1>Launch a research project</h1>
<form action="#" method="post" onsubmit="return false">
  <label for="title">Project title</label>
  <input type="text" id="title" name="title" maxlength="120" required>

  <label for="researcher">Researcher name</label>
  <input type="text" id="researcher" name="researcher_name" required>

  <label for="inst">Institution</label>
  <input type="text" id="inst" name="institution">

  <label for="em">Email</label>
  <input type="email" id="em" name="email" required>

  <label for="ctry">Country</label>
  <select id="ctry" name="country">
    <option value="">Select a country</option>
    <option>Thailand</option><option>Singapore</option><option>Malaysia</option><option>Indonesia</option>
    <option>Vietnam</option><option>Philippines</option><option>Japan</option><option>United States</option>
    <option>United Kingdom</option><option>Other</option>
  </select>

  <label for="disc">Discipline</label>
  <select id="disc" name="discipline" required>
    <option value="">Choose a discipline</option>
    <option>Materials science</option><option>Agritech</option><option>Biotechnology</option><option>Energy</option>
    <option>Environmental</option><option>Food science</option><option>Health &amp; medtech</option><option>Engineering</option>
  </select>

  <fieldset>
    <legend>What stage is the research at?</legend>
    <input type="radio" id="st1" name="stage" value="idea"><label for="st1">Idea</label>
    <input type="radio" id="st2" name="stage" value="lab"><label for="st2">Lab result</label>
    <input type="radio" id="st3" name="stage" value="proto"><label for="st3">Prototype</label>
    <input type="radio" id="st4" name="stage" value="pilot"><label for="st4">Pilot</label>
  </fieldset>

  <label for="goal">Funding goal (USD)</label>
  <input type="number" id="goal" name="funding_goal" min="500" required>

  <label for="len">Campaign length</label>
  <select id="len" name="campaign_length"><option>30 days</option><option>45 days</option><option>60 days</option></select>

  <fieldset>
    <legend>Budget items</legend>
    <input type="checkbox" id="b1" name="budget_items" value="equipment"><label for="b1">Equipment</label>
    <input type="checkbox" id="b2" name="budget_items" value="materials"><label for="b2">Materials &amp; consumables</label>
    <input type="checkbox" id="b3" name="budget_items" value="personnel"><label for="b3">Personnel</label>
    <input type="checkbox" id="b4" name="budget_items" value="travel"><label for="b4">Travel</label>
    <input type="checkbox" id="b5" name="budget_items" value="publication"><label for="b5">Publication fees</label>
  </fieldset>

  <label for="ctx">What is the context of this research?</label>
  <textarea id="ctx" name="context" rows="5" maxlength="2000" required></textarea>

  <label for="sig">What is the significance of this project?</label>
  <textarea id="sig" name="significance" rows="5" maxlength="2000"></textarea>

  <label for="goals">What are the goals of the project?</label>
  <textarea id="goals" name="goals" rows="5" maxlength="2000" required></textarea>

  <label for="bud">Budget overview</label>
  <textarea id="bud" name="budget_overview" rows="4" maxlength="1500"></textarea>

  <label for="kw">Keywords</label>
  <input type="text" id="kw" name="keywords" placeholder="comma separated">

  <p><input type="checkbox" id="terms" name="accept_terms" required> <label for="terms" style="display:inline">I agree to the platform terms and confirm I have the right to share this content</label></p>

  <button type="submit">Submit for review</button>
</form>
</body>
</html>
